name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.dvc'
      - '.dvc/**'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: income-production
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Authenticate to AWS
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PY'
          import json, os
          credentials = json.loads(os.environ["STORAGE_CREDENTIALS"])
          fields = {"aws_access_key_id": "AWS_ACCESS_KEY_ID",
                    "aws_secret_access_key": "AWS_SECRET_ACCESS_KEY",
                    "aws_session_token": "AWS_SESSION_TOKEN"}
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              for source, target in fields.items():
                  value = credentials.get(source)
                  if not value:
                      if source == "aws_session_token":
                          continue
                      raise SystemExit(f"Missing credential field: {source}")
                  if "\n" in value or "\r" in value:
                      raise SystemExit("Invalid credential format")
                  print(f"::add-mask::{value}")
                  handle.write(f"{target}={value}\n")
          PY
      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: 'file:./mlruns'
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json, os
          with open("outputs/report.json") as handle:
              f1 = float(json.load(handle)["f1_score"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"f1={f1}\n")
          PY
      - name: Save model for release
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/model.joblib
          if-no-files-found: error
      - name: Save report as artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PY'
          import math, os
          f1 = float(os.environ["F1"])
          if not math.isfinite(f1) or not 0 <= f1 <= 1:
              raise SystemExit(f"FAILED: invalid f1_score {f1}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Deployment blocked.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65")
          PY

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install AWS SDK
        run: python -m pip install 'boto3>=1.34,<2'
      - name: Authenticate to AWS
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PY'
          import json, os
          credentials = json.loads(os.environ["STORAGE_CREDENTIALS"])
          fields = {"aws_access_key_id": "AWS_ACCESS_KEY_ID",
                    "aws_secret_access_key": "AWS_SECRET_ACCESS_KEY",
                    "aws_session_token": "AWS_SESSION_TOKEN"}
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              for source, target in fields.items():
                  value = credentials.get(source)
                  if not value:
                      if source == "aws_session_token":
                          continue
                      raise SystemExit(f"Missing credential field: {source}")
                  if "\n" in value or "\r" in value:
                      raise SystemExit("Invalid credential format")
                  print(f"::add-mask::{value}")
                  handle.write(f"{target}={value}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: models
      # Publish only after Quality Gate succeeds; rejected models must not replace current.
      - name: Upload model to S3
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PY'
          import boto3, os
          boto3.client("s3").upload_file(
              "models/model.joblib",
              os.environ["ARTIFACT_BUCKET"],
              "artifacts/current/model.joblib",
          )
          print("Uploaded model.joblib successfully")
          PY
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -eu
            sudo systemctl restart income-api
            for attempt in $(seq 1 24); do
              if curl --fail --silent http://localhost:8080/healthz; then
                echo
                echo "Health check passed."
                exit 0
              fi
              sleep 5
            done
            sudo journalctl -u income-api --no-pager -n 50
            echo "Health check failed."
            exit 1
